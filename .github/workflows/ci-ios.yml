name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - "packages/api-contract/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/api-contract/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-ios.yml"

jobs:
  ci:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated Swift in apps/ios/Modules/CoreAPI must match the Zod schemas
      # in packages/api-contract. Fails when someone edits schemas without running
      # `pnpm --filter @repo/api-contract codegen` and committing the result.
      - name: Check generated API types are current
        run: pnpm --filter @repo/api-contract codegen:check

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: API package tests
        working-directory: apps/ios/Modules/API
        run: swift test

      - name: CoreAPI package tests (wire fixtures)
        working-directory: apps/ios/Modules/CoreAPI
        run: swift test

      - name: Entities package tests
        working-directory: apps/ios/Modules/Entities
        run: swift test

      - name: MarkdownParsing package tests
        working-directory: apps/ios/Modules/MarkdownParsing
        run: swift test

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Select iOS simulator
        id: simulator
        working-directory: apps/ios
        run: |
          simulator_id=$(
            xcrun simctl list devices available --json | python3 -c '
          import json
          import sys

          runtimes = json.load(sys.stdin)["devices"]
          ios_runtimes = {
              runtime: devices
              for runtime, devices in runtimes.items()
              if ".iOS-" in runtime
          }
          latest_runtime = max(
              ios_runtimes,
              key=lambda runtime: tuple(
                  int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-")
              ),
          )
          simulator = next(
              device
              for device in ios_runtimes[latest_runtime]
              if device["isAvailable"] and device["name"].startswith("iPhone")
          )
          print(simulator["udid"])
          '
          )
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Build app for testing
        working-directory: apps/ios
        run: |
          xcodebuild build-for-testing -project CloudeCode.xcodeproj -scheme CloudeCode \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: App unit tests
        working-directory: apps/ios
        run: |
          xcodebuild test-without-building -project CloudeCode.xcodeproj -scheme CloudeCode \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath .build/DerivedData \
            -only-testing:CloudeCodeTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: UI smoke test
        working-directory: apps/ios
        run: |
          xcodebuild test-without-building -project CloudeCode.xcodeproj -scheme CloudeCode \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath .build/DerivedData \
            -only-testing:CloudeCodeUITests/CloudeCodeUITests/testLaunchesSignedOutScreen \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
